[package]
name = "source2-demo-protobufs"
description = "Dota 2, Deadlock, and CS2 Protobufs"
categories = ["parsing"]
keywords = ["dota", "deadlock", "cs2", "replay", "demo"]
readme = "README.md"
exclude = ["update-protobufs.sh"]
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "./lib.rs"

[build-dependencies]
protox = { version = "0.10", optional = true }
prost-build = "0.14"
itertools = "0.15"
ureq = "3.1"

[dependencies]
prost-reflect = { version = "0.16", optional = true }
serde = { version = "1.0", features = ["derive"] }
prost = "0.14"

[features]
reflection = ["dep:protox", "dep:prost-reflect"]
dota = []
citadel = []
cs2 = []