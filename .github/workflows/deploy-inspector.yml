name: Deploy inspector to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/deploy-inspector.yml
      - Cargo.toml
      - source2-demo/**
      - source2-demo-macros/**
      - source2-demo-protobufs/**
      - source2-demo-inspector/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: source2-demo-inspector
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source2-demo-inspector/package-lock.json

      - name: Install the Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.1 --locked

      - name: Install frontend dependencies
        run: npm ci

      - name: Build inspector
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source2-demo-inspector/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy inspector
        id: deployment
        uses: actions/deploy-pages@v4
