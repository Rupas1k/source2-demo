[package]
name = "demo-inspector-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
source2-demo = { path = "../../source2-demo", default-features = false, features = ["reflection", "entity-field-updates"] }
wasm-bindgen = "0.2"
prost = "0.14"
prost-reflect = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
